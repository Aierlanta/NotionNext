name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day UTC 00:00 (北京时间 08:00)
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 可选 Secrets.SYNC_UPSTREAM_TOKEN：classic PAT（repo + workflow）
          # 有它才能同步上游对 .github/workflows 的改动；没有则同步业务代码并保留 fork 自己的 workflows
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN != '' && secrets.SYNC_UPSTREAM_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream with custom protections
        id: sync
        env:
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN != '' }}
          # 冲突时保留 fork 版本的个性化配置/代码
          PROTECTED_PATHS: |
            blog.config.js
            conf/widget.config.js
            conf/contact.config.js
            conf/animation.config.js
            components/Live2D.js
            .github/workflows/sync.yaml
        run: |
          set -euo pipefail

          UPSTREAM_REPO="notionnext-org/NotionNext"
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$UPSTREAM_URL"
          else
            git remote add upstream "$UPSTREAM_URL"
          fi

          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t PROTECTED < <(echo "$PROTECTED_PATHS" | sed '/^\s*$/d')

          SNAPSHOT_DIR="$(mktemp -d)"
          for f in "${PROTECTED[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "$SNAPSHOT_DIR/$(dirname "$f")"
              cp "$f" "$SNAPSHOT_DIR/$f"
              echo "Snapshot protected: $f"
            fi
          done

          # 默认 GITHUB_TOKEN 无法推送 workflow 文件变更（历史失败原因）
          KEEP_WORKFLOWS=false
          if [ "$HAS_SYNC_TOKEN" != "true" ]; then
            KEEP_WORKFLOWS=true
            cp -a .github/workflows "$SNAPSHOT_DIR/workflows"
            echo "No SYNC_UPSTREAM_TOKEN: will preserve fork workflows to avoid push rejection"
          fi

          set +e
          git merge upstream/main --no-edit
          MERGE_STATUS=$?
          set -e

          if [ "$MERGE_STATUS" -ne 0 ]; then
            echo "Merge conflicts detected; resolving with protection rules..."

            for lockfile in yarn.lock package-lock.json; do
              if git ls-files -u -- "$lockfile" | grep -q .; then
                git checkout --theirs -- "$lockfile"
                git add -- "$lockfile"
                echo "Resolved $lockfile -> upstream"
              fi
            done

            REMAINING="$(git diff --name-only --diff-filter=U || true)"
            if [ -n "$REMAINING" ]; then
              echo "Remaining conflicts:"
              echo "$REMAINING"
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                git checkout --theirs -- "$f"
                git add -- "$f"
              done <<< "$REMAINING"
            fi

            for f in "${PROTECTED[@]}"; do
              if [ -f "$SNAPSHOT_DIR/$f" ]; then
                mkdir -p "$(dirname "$f")"
                cp "$SNAPSHOT_DIR/$f" "$f"
                git add -- "$f"
                echo "Restored protected: $f"
              fi
            done

            git commit --no-edit -m "merge: sync upstream/main (preserve fork custom configs)"
          fi

          if [ "$KEEP_WORKFLOWS" = true ]; then
            rm -rf .github/workflows
            cp -a "$SNAPSHOT_DIR/workflows" .github/workflows
            git add .github/workflows
            if ! git diff --cached --quiet; then
              git commit -m "chore: keep fork workflow files after upstream sync"
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push synced branch
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 自动同步失败。"
          echo "常见原因："
          echo "1. 上游改了 .github/workflows，且未配置 Secrets.SYNC_UPSTREAM_TOKEN（classic PAT，需 repo + workflow 权限）"
          echo "2. 其它推送权限/分支保护问题"
          echo "可先到 GitHub 页面手动 Sync fork，或本地执行: git fetch upstream && git merge upstream/main"
          exit 1
